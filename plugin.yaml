apiVersion: argoproj.io/v1alpha1
kind: ConfigManagementPlugin
metadata:
  name: helmfile
spec:
  init:
    command: ["argo-cd-helmfile.sh"]
    args: ["init"]
  generate:
    command: ["argo-cd-helmfile.sh"]
    args: ["generate"]
  discover:
    find:
      command: ["argo-cd-helmfile.sh", "discover"]
  parameters:
    dynamic:
      command: ["argo-cd-helmfile.sh", "parameters"]
  preserveFileMode: true
