name: Build, test and publish

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: argo-cd-helmfile:test

      - name: Test installed tools
        run: |
          docker run --rm \
            argo-cd-helmfile:test \
            /bin/sh -ec '
              helm version --short
              helmfile version
              kubectl version --client
              kustomize version
              kubeseal --version
              sops --version
              age --version
              yq --version

              helm plugin list
              helm plugin list | grep -q diff
              helm plugin list | grep -q secrets
              helm plugin list | grep -q git
            '

      - name: Test Helmfile rendering
        run: |
          docker run --rm \
            -v "$PWD/tests:/tests:ro" \
            -w /tests \
            argo-cd-helmfile:test \
            helmfile -f helmfile.yaml template --skip-deps \
            > rendered.yaml

          grep -q "kind: ConfigMap" rendered.yaml
          grep -q "name: renovate-smoke-test" rendered.yaml

      - name: Test CMP entrypoint
        run: |
          docker run --rm \
            -v "$PWD/tests:/tests:ro" \
            -w /tests \
            argo-cd-helmfile:test \
            argo-cd-helmfile.sh discover

  publish:
    name: Publish image
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        shell: bash
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          SHORT_SHA="${GITHUB_SHA:0:12}"

          {
            echo "tags<<EOF"
            echo "${IMAGE}:latest"
            echo "${IMAGE}:sha-${SHORT_SHA}"
            echo "${IMAGE}:${GITHUB_RUN_NUMBER}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: true
          sbom: true
